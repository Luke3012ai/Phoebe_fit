<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phoebe Fit</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Phoebe Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
[hidden]{display:none!important}

/* Layout: one phone-width column. Summary rings first, then week picker, then colour day cards; tabs fixed at the bottom. */
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--fg:#fff;--fg2:#aeaeb2;--fg3:#7c7c80;--line:#3a3a3c;
  --move:#fa114f;--ex:#a6f600;--stand:#1ed3ff;--limb:#f2f2f7;--limb2:#7c7c80;--prop:#3a3a3c;--cable:#8e8e93;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding-inline:16px;padding-block:0;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stand);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-bottom:110px}
.hdr{padding-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr .date{color:var(--fg3);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hdr h1{margin:2px 0 0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.sync{font-size:11px;font-weight:700;padding:5px 9px;border-radius:99px;background:var(--bg2);color:var(--fg2);white-space:nowrap;margin-bottom:6px}
.sync.ok{color:var(--ex)}.sync.bad{color:#ffb340}
.card{background:var(--bg2);border-radius:22px;padding:16px}
.sec{margin:26px 0 10px;font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:13px;color:var(--fg3);font-weight:600}
/* rings */
.rings{display:flex;gap:18px;align-items:center;margin-top:16px}
.rings svg{width:150px;height:150px;flex:none}
.legend{display:grid;gap:10px;min-width:0;flex:1}
.legend .k{font-size:12px;font-weight:700;letter-spacing:.02em}
.legend .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.legend .v small{font-size:13px;font-weight:700;color:var(--fg3)}
/* week picker */
.weeks{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:46px;height:58px;border-radius:15px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:18px;position:relative;scroll-snap-align:center}
.wk i{width:18px;height:4px;border-radius:2px;background:var(--pc)}
.wk em{position:absolute;top:4px;right:6px;font-size:9px;font-style:normal;color:var(--fg3)}
.wk[aria-pressed=true]{background:var(--fg);color:#000}
.wk.cur::after{content:"";position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--fg2)}
.wkp{margin-top:6px}
.wkp .ph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.wkp .ph b{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.wkp p{margin:6px 0 12px;color:var(--fg2);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--bg3);border-radius:14px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:11px;color:var(--fg3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.note{margin-top:10px;font-size:13px;color:#ffd60a;font-weight:600}
/* day cards */
.days{display:grid;gap:12px}
.day{position:relative;text-align:left;border-radius:24px;padding:16px 16px 14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));min-height:112px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;width:100%}
.day::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.day .dn{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.day h3{margin:2px 0 0;font-size:21px;line-height:1.15;font-weight:800;text-wrap:balance;padding-right:56px;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.day .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:700}
.day .meta span{background:rgba(0,0,0,.22);padding:4px 9px;border-radius:99px}
.day.today{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff,0 10px 30px -8px var(--c1)}
.tag{position:absolute;right:12px;top:12px;z-index:1;font-size:11px;font-weight:900;letter-spacing:.06em;background:#fff;color:#000;border-radius:99px;padding:4px 9px}
.tag.done{background:rgba(0,0,0,.35);color:#fff}
.day:active{transform:scale(.985)}
/* check-in form */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fld{background:var(--bg3);border-radius:14px;padding:9px 12px;min-width:0}
.fld label{display:block;font-size:11px;color:var(--fg3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.fld input{width:100%;background:none;border:0;font-size:20px;font-weight:800;padding:2px 0;outline:none;font-variant-numeric:tabular-nums;min-width:0}
.fld small{color:var(--fg3);font-size:11px}
.fld input::placeholder{color:#555}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,20,22,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--fg3);padding:4px}
.tab svg{width:26px;height:26px}
.tab[aria-selected=true]{color:var(--move)}
/* history */
.hs{display:grid;gap:10px}
.hi{background:var(--bg2);border-radius:20px;overflow:hidden}
.hi>button{display:flex;width:100%;text-align:left;gap:12px;padding:14px;align-items:center}
.dot{width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-weight:800;font-size:13px}
.hi h4{margin:0;font-size:16px}.hi p{margin:2px 0 0;font-size:13px;color:var(--fg2)}
.hd{padding:0 14px 14px;font-size:13px}
.hd table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hd td,.hd th{padding:5px 4px;border-top:1px solid var(--line);text-align:left}
.hd th{color:var(--fg3);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.btn2{background:var(--bg3);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
.btn2.red{color:#ff6961}
.empty{color:var(--fg3);text-align:center;padding:28px 12px}
/* guide */
.g h2{margin:0 0 8px;font-size:17px}
.g{margin-bottom:12px}
.g ul{margin:6px 0 0;padding-left:18px;color:var(--fg2)}.g li{margin:4px 0}
.g p{margin:6px 0;color:var(--fg2)}
.g b{color:var(--fg)}
.red{border:1px solid #ff453a55}
.red h2{color:#ff6961}
.tgt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
details.g summary{font-weight:800;font-size:17px;cursor:pointer;list-style:none}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";float:right;color:var(--fg3)}
details.g[open] summary::after{content:"–"}
/* sheet & player */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--bg2);border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .top{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.sheet .top h2{margin:0;font-size:24px;line-height:1.1}.sheet .top p{margin:6px 0 0;font-weight:700;opacity:.92;font-size:14px}
.blk{margin-top:14px}.blk h5{margin:0 0 6px;font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row span{color:var(--fg2);text-align:right;font-variant-numeric:tabular-nums}
.row b{min-width:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;background:var(--bg3);border-radius:16px;padding:12px 14px}
.tog small{display:block;color:var(--fg3);font-size:12px}
.sw{width:50px;height:30px;border-radius:99px;background:#48484a;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:#30d158}.sw[aria-checked=true]::after{left:23px}
.big{width:100%;border-radius:18px;padding:16px;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--c1,#fa114f),var(--c2,#ff6a3d));color:#fff;margin-top:14px;box-shadow:0 8px 24px -10px var(--c1,#fa114f)}
.big.ghost{background:var(--bg3);box-shadow:none}
.player{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}
.pin{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.pbar{display:flex;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:18px;flex:none}
.prog{flex:1;display:flex;gap:2px;height:6px;min-width:0}
.prog i{flex:1;border-radius:3px;background:var(--bg3)}.prog i.d{background:var(--c1)}.prog i.n{background:#fff}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c1)}
.lbl span:last-child{color:var(--fg3)}
.figbox{background:var(--bg2);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c1) 26%,#1c1c1e),#1c1c1e 70%);border-radius:28px;padding:4px;flex:none;overflow:hidden}
.fig{width:100%;height:auto;display:block}
.pname{margin:0;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.peq{margin:2px 0 0;color:var(--fg3);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--bg2);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.pill.hot{background:var(--c1);color:#fff}
.pill.zone{background:#1e8e3e;color:#fff}
.sdots{display:flex;gap:7px;margin-top:10px}
.sdots i{width:12px;height:12px;border-radius:50%;background:var(--bg3)}.sdots i.d{background:var(--c1)}.sdots i.n{box-shadow:0 0 0 2px #000,0 0 0 4px #fff}
.hint{margin-top:8px;font-size:13px;color:var(--fg2)}
.hint b{color:var(--ex)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{background:var(--bg2);border-radius:20px;padding:10px 10px 12px;text-align:center;min-width:0}
.stp span{font-size:11px;color:var(--fg3);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.stp output{display:block;font-size:36px;font-weight:800;line-height:1.1;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.stp output small{font-size:15px;color:var(--fg3);font-weight:700}
.stp div{display:flex;gap:8px;justify-content:center}
.stp button{width:56px;height:44px;border-radius:14px;background:var(--bg3);font-size:24px;font-weight:700}
.stp button:active{background:#48484a}
.cue{font-size:14px;color:var(--fg2);background:var(--bg2);border-radius:16px;padding:10px 12px}
.cue b{color:var(--fg)}
.spacer{flex:1}
.ringbox{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:6px auto}
.ringbox svg{width:100%;height:100%}
.ringbox .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox .ctr b{font-size:clamp(46px,16vw,66px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ringbox .ctr small{font-size:13px;color:var(--fg3);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.adj{display:flex;justify-content:center;gap:10px}
.adj button{background:var(--bg2);border-radius:99px;padding:10px 18px;font-weight:800;font-size:15px}
.next{display:flex;gap:12px;align-items:center;background:var(--bg2);border-radius:20px;padding:8px 12px 8px 8px}
.next .figbox{width:96px;padding:0;background:var(--bg3);border-radius:14px}
.next .figbox .fig{max-height:none}
.next small{display:block;color:var(--fg3);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.next b{font-size:17px;line-height:1.2}
.next p{margin:2px 0 0;font-size:13px;color:var(--fg2)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 .tile{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:#fff;color:#000;border-radius:99px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.rings svg{width:124px;height:124px}.legend .v{font-size:20px}}

.rings svg{filter:drop-shadow(0 0 12px rgba(250,17,79,.28))}
.dfig{position:absolute;right:4px;bottom:2px;width:120px;height:120px;z-index:0;pointer-events:none}
.day>*{position:relative;z-index:1}.day>.dfig{position:absolute;z-index:0}.day>.tag{position:absolute}
.day h3{padding-right:112px}
.row{align-items:center;gap:12px}
.thumb{width:56px;height:56px;border-radius:14px;background:var(--bg3);flex:none;overflow:hidden}
.thumb .fig{height:100%}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt span{text-align:left;font-size:13px}
.next .figbox{background:var(--bg3);border-radius:16px;width:92px}

</style>

<script>
/* ---------- Stick-figure engine: forward kinematics + 2-link arm IK ---------- */
const FL = 148; // floor y
const LEN = { torso: 56, thigh: 40, shin: 40, foot: 14, ua: 28, fa: 28 };
const rad = d => d * Math.PI / 180;
const dirv = (a, l) => [Math.sin(rad(a)) * l, Math.cos(rad(a)) * l];

function lerpAny(a, b, k) {
  if (Array.isArray(a)) return a.map((v, i) => lerpAny(v, b ? b[i] : v, k));
  if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * k;
  return b !== undefined && k > 0.5 ? b : a;
}
function mixPose(p0, p1, k) {
  const o = {};
  const keys = new Set([...Object.keys(p0), ...Object.keys(p1)]);
  keys.forEach(key => {
    const a = p0[key] !== undefined ? p0[key] : p1[key];
    const b = p1[key] !== undefined ? p1[key] : p0[key];
    o[key] = lerpAny(a, b, k);
  });
  return o;
}
function ik(S, T, side) {
  let dx = T[0] - S[0], dy = T[1] - S[1];
  let d = Math.hypot(dx, dy);
  const max = LEN.ua + LEN.fa - 0.5;
  let tx = T[0], ty = T[1];
  if (d > max) { tx = S[0] + dx / d * max; ty = S[1] + dy / d * max; d = max; dx = tx - S[0]; dy = ty - S[1]; }
  const h = Math.sqrt(Math.max(0, LEN.ua * LEN.ua - (d / 2) * (d / 2)));
  const mx = S[0] + dx / 2, my = S[1] + dy / 2;
  const px = -dy / d, py = dx / d;
  const c1 = [mx + px * h, my + py * h], c2 = [mx - px * h, my - py * h];
  const pick = (a, b, f) => f(a) >= f(b) ? a : b;
  const fns = { d: p => p[1], u: p => -p[1], b: p => -p[0], f: p => p[0] };
  return { elbow: pick(c1, c2, fns[side || 'd']), wrist: [tx, ty] };
}
function solve(p) {
  const P = Object.assign({ t: 0, th: 0, sh: 0, ua: 0, fa: 0, ft: 90, mode: 'feet', ax: 100, hx: 100, an: 'n' }, p);
  const th2 = P.th2 !== undefined ? P.th2 : P.th, sh2 = P.sh2 !== undefined ? P.sh2 : P.sh;
  const ft2 = P.ft2 !== undefined ? P.ft2 : P.ft;
  const legRel = (th, sh, ft) => {
    const k = dirv(th, LEN.thigh), a = [k[0] + dirv(sh, LEN.shin)[0], k[1] + dirv(sh, LEN.shin)[1]];
    const toe = [a[0] + dirv(ft, LEN.foot)[0], a[1] + dirv(ft, LEN.foot)[1]];
    return { k, a, toe };
  };
  const n = legRel(P.th, P.sh, P.ft), f = legRel(th2, sh2, ft2);
  let hip;
  if (P.mode === 'hip') hip = [P.hx, P.hy];
  else {
    const maxY = Math.max(n.a[1], n.toe[1], f.a[1], f.toe[1]);
    const anchor = P.an === 'm' ? (n.a[0] + f.a[0]) / 2 : n.a[0];
    hip = [P.ax - anchor, FL - maxY];
  }
  let t = P.t;
  if (P.neckY !== undefined) {
    const c = Math.max(-1, Math.min(1, (hip[1] - P.neckY) / LEN.torso));
    t = -Math.acos(c) * 180 / Math.PI;
  }
  const td = [Math.sin(rad(t)), -Math.cos(rad(t))];
  const neck = [hip[0] + td[0] * LEN.torso, hip[1] + td[1] * LEN.torso];
  const sh_ = [hip[0] + td[0] * LEN.torso * 0.92, hip[1] + td[1] * LEN.torso * 0.92];
  const head = [hip[0] + td[0] * (LEN.torso + 13), hip[1] + td[1] * (LEN.torso + 13)];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const leg = (r) => ({ knee: add(hip, r.k), ankle: add(hip, r.a), toe: add(hip, r.toe) });
  const arm = (ua, fa, hand, hr, eb) => {
    let tgt = null;
    if (hand === 'hip') tgt = [hip[0], hip[1] - 4];
    else if (hand) tgt = hand;
    else if (hr) tgt = [sh_[0] + hr[0], sh_[1] + hr[1]];
    if (tgt) return ik(sh_, tgt, eb);
    const e = add(sh_, dirv(ua, LEN.ua));
    return { elbow: e, wrist: add(e, dirv(fa, LEN.fa)) };
  };
  const nearArm = arm(P.ua, P.fa, P.hand, P.hr, P.eb);
  const farArm = (P.ua2 !== undefined || P.hand2 || P.hr2) ? arm(P.ua2, P.fa2, P.hand2, P.hr2, P.eb2 || P.eb) : nearArm;
  return { hip, neck, sh: sh_, head, near: leg(n), far: leg(f), nArm: nearArm, fArm: farArm, P, t };
}

/* ---------- v2 renderer: auto-framed, chunky, animated; one shared rAF loop ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const P2 = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
const FIGS = new Set();
let figRaf = 0;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function figLoop(now) {
  FIGS.forEach(f => { if (!f.host.isConnected) { FIGS.delete(f); return; } f.draw(now); });

function buildSteps(w, sid, easy) {

  [['A', S.A], ['B', S.B]].forEach(([blk, pair]) => {
    const e1 = EX[pair[0]], e2 = EX[pair[1]];
    const n1 = trim(e1.kind === 'M' ? wi.main : wi.acc), n2 = trim(e2.kind === 'M' ? wi.main : wi.acc);
    [[e1, n1, blk + '1'], [e2, n2, blk + '2']].forEach(([e, n, lab]) => {
      const rest = e.kind === 'M' ? wi.restM : wi.restA;
      for (let i = 0; i < n; i++) steps.push({ cat: 'set', ex: e.id, n: i + 1, of: n, label: lab, block: 'Block ' + blk, rng: rangeFor(e, wi), rir: wi.rir, rest: i === n - 1 ? 45 : rest, restKind: i === n - 1 ? 'switch' : 'rest' });
    });

  const rounds = easy ? Math.max(1, wi.rounds - 1) : wi.rounds;
  S.C.forEach((k, i) => {
    const e = EX[k];
    for (let r = 0; r < rounds; r++) {
      const last = (i === S.C.length - 1 && r === rounds - 1);
      const st = { cat: e.kind === 'T' ? 'tset' : 'set', ex: k, n: r + 1, of: rounds, label: 'C' + (i + 1), block: 'Circuit C', rng: rangeFor(e, wi), rir: '2 to 3', rest: last ? 0 : (r === rounds - 1 ? 30 : 40), restKind: r === rounds - 1 ? 'switch' : 'rest' };
      if (e.kind === 'T') { st.secs = wi.tsec; st.rng = [wi.tsec, wi.tsec]; }
      steps.push(st);
    }
  });
  steps.push({ cat: 'z2', ex: 'zone2', secs: Math.round(wi.z2 * (easy ? 0.75 : 1) / 5) * 5 * 60 || wi.z2 * 60, block: 'Zone 2 finisher', label: 'Zone 2', rest: 0 });

}

      (st.cat === 'tset' ? '<span class="pill hot">Hold ' + st.secs + ' s · round ' + st.n + ' of ' + st.of + '</span>' : '') +
      (st.cat === 'warm' ? '<span class="pill">Warm-up</span>' : '') + '</div></div>' +
      '<div class="ringbox" style="margin:0 auto;width:min(46vw,190px)"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--c1)" stroke-opacity=".22" stroke-width="14"/><circle id="tring" cx="100" cy="100" r="88" fill="none" stroke="var(--c1)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="0 553"/></svg><div class="ctr"><b id="tleft" style="font-size:clamp(34px,11vw,48px)">' + mmss(t.left) + '</b></div></div>' +
      (hasW ? '<div class="steps" style="grid-template-columns:1fr"><div class="stp"><span>Weight each hand</span><output>' + fmtKg(P.wt) + ' <small>kg</small></output><div><button data-act="wm" aria-label="Less weight">−</button><button data-act="wp" aria-label="More weight">+</button></div></div></div>' : '') +
      '<div class="cue"><b>Cue:</b> ' + ex.cue + '</div><div class="spacer"></div>' +
      (t.done ? '<button class="big" data-act="tnext">' + (st.cat === 'tset' ? 'Done, next' : 'Next') + '</button>' :
        '<div class="adj" style="margin-bottom:2px"><button data-act="tgo" style="background:var(--c1);color:#fff;flex:1;max-width:220px">' + (t.running ? 'Pause' : (t.left < t.total ? 'Resume' : 'Start')) + '</button><button data-act="tskip">' + (st.cat === 'tset' ? 'Done early' : 'Skip') + '</button></div>') + '</div>';
    pl.innerHTML = h; figure('#fig', st.ex, s.c1); paintTimer(); return;
  }
  // work (set)
  const sg = P.sg, l = sg.prev;
  const dots = Array.from({ length: st.of }, (_, i) => '<i class="' + (i < st.n - 1 ? 'd' : i === st.n - 1 ? 'n' : '') + '"></i>').join('');
  const hint = sg.first ? 'First time: start light, finish with ' + (st.rir) + ' reps in reserve.' :
    'Last time: <b>' + (l.w ? fmtKg(l.w) + ' kg' : 'BW') + ' × ' + l.reps.join(', ') + '</b>' + (sg.add ? ' · <b>Add ' + fmtKg(sg.add) + ' kg</b> today' : sg.harder ? ' · Top of range, make it harder' : ' · beat your reps');
  h += lbl + figbox + '<div><h1 class="pname">' + ex.name + '</h1><p class="peq">' + ex.equip + '</p><div class="pills"><span class="pill hot">Set ' + st.n + ' of ' + st.of + '</span><span class="pill">' + rngTxt(st.rng) + ' reps' + (ex.per ? ' /side' : '') + '</span><span class="pill">RIR ' + st.rir + '</span></div><div class="sdots">' + dots + '</div><div class="hint">' + hint + '</div></div>' +
    '<div class="steps"><div class="stp"><span>' + (ex.bw && !ex.w0 ? 'Added kg' : 'Weight') + '</span><output>' + wtLabel(ex) + (P.wt || !ex.bw ? ' <small>kg</small>' : '') + '</output><div><button data-act="wm" aria-label="Less weight">−</button><button data-act="wp" aria-label="More weight">+</button></div></div>' +
    '<div class="stp"><span>Reps done</span><output>' + P.r + '</output><div><button data-act="rm" aria-label="Fewer reps">−</button><button data-act="rp" aria-label="More reps">+</button></div></div></div>' +
    '<div class="cue"><b>Cue:</b> ' + ex.cue + '</div><div class="spacer"></div><button class="big" data-act="dset" style="margin-top:0">Done set</button></div>';
  pl.innerHTML = h; figure('#fig', st.ex, s.c1);
}
function stepW(dir) { const ex = EX[stepOf().ex]; const inc = ex.inc || 2.5; P.wt = Math.max(0, Math.round((P.wt + dir * inc) * 10) / 10); }

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],.tab'); if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
  if (t.classList.contains('tab')) { S.tab = t.dataset.t; paint(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act;
  if (a === 'week') { S.week = +t.dataset.w; try { localStorage.setItem('pf.week', S.week); } catch (x) {} const wk = $('#weeks'); if (wk) wk.dataset.done = 1; const sx = wk ? wk.scrollLeft : 0; paint(); const nw = $('#weeks'); if (nw) { nw.dataset.done = 1; nw.scrollLeft = sx; } }
  else if (a === 'open') { easyDay = false; openSheet(t.dataset.s); }
  else if (a === 'closesheet') closeSheet();
  else if (a === 'easy') { easyDay = !easyDay; openSheet($('#scrim').dataset.s); }
  else if (a === 'start') { clearWip(); startPlayer(t.dataset.s, S.week, false); }
  else if (a === 'resume') startPlayer(t.dataset.s, S.week, true);
  else if (a === 'hist') { S.open[t.dataset.id] = S.open[t.dataset.id] ? 0 : 1; paint(); }
  else if (a === 'del') { if (S.open[t.dataset.id] === 'confirm') { delSession(t.dataset.id); toast('Deleted'); } else S.open[t.dataset.id] = 'confirm'; paint(); }
  // player
  else if (!P) return;
  else if (a === 'pquit') { P.confirm = true; render(); }
  else if (a === 'pback') { P.confirm = false; render(); }
  else if (a === 'psave') finish();
  else if (a === 'pdiscard') { clearWip(); closePlayer(); }
  else if (a === 'pclose') closePlayer();
  else if (a === 'wm') { stepW(-1); render(); }
  else if (a === 'wp') { stepW(1); render(); }
  else if (a === 'rm') { P.r = Math.max(0, P.r - 1); render(); }
  else if (a === 'rp') { P.r++; render(); }
  else if (a === 'dset') { logSet(); afterSet(); }
  else if (a === 'radj') { const d = +t.dataset.d; P.timer.end += d * 1000; P.timer.total = Math.max(5, P.timer.total + d); P.timer.left = Math.max(0, Math.ceil((P.timer.end - Date.now()) / 1000)); paintTimer(); if (P.timer.left <= 0) { advance(); } }
  else if (a === 'rskip') advance();
  else if (a === 'rundo') { P.log.pop(); P.mode = 'work'; render(); }
  else if (a === 'tgo') {
    const tm = P.timer; beep(1, 0.01, 0.0001);
    if (tm.running) { tm.running = false; tm.left = Math.max(0, Math.ceil((tm.end - Date.now()) / 1000)); }
    else { tm.end = Date.now() + tm.left * 1000; tm.running = true; beep(740, 0.1); }
    render();
  }
  else if (a === 'tskip') {
    const st = stepOf(), tm = P.timer;
    if (tm.running) tm.left = Math.max(0, Math.ceil((tm.end - Date.now()) / 1000)); tm.running = false;
    if (st.cat === 'tset') { logSet(Math.max(1, tm.total - tm.left)); afterSet(); } else advance();
  }
  else if (a === 'tnext') { const st = stepOf(); if (st.cat === 'tset') { logSet(st.secs); afterSet(); } else advance(); }
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if (f) { const v = e.target.value === '' ? null : parseFloat(e.target.value); saveWeekly(S.week, { [f]: v }); toast('Saved'); }
  if (e.target.id === 'f_start' && e.target.value) { saveStart(e.target.value); toast('Start date saved'); S.week = curWeek(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && P && P.timer && P.timer.running) { onTick(); } if (!document.hidden && P) wake(true); });

/* ================= boot ================= */
loadLocal();
try { const w = parseInt(localStorage.getItem('pf.week'), 10); S.week = w >= 1 && w <= 12 ? w : curWeek(); } catch (e) { S.week = curWeek(); }
S.week = curWeek();
$('#tabbar').innerHTML = '<div><button class="tab" data-t="sum" role="tab">' + ICON.sum + 'Summary</button><button class="tab" data-t="hist" role="tab">' + ICON.hist + 'History</button><button class="tab" data-t="guide" role="tab">' + ICON.guide + 'Guide</button></div>';
paint();
connect();

</script>
